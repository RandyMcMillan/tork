[package]
name = "tork-rs-web"
version = "0.1.0"
edition = "2021"
description = "Rust FFI bindings for the Tork workflow engine web/REST API types"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tork-rs = { path = "../tork-rs" }

[build-dependencies]
bindgen = "0.71"
